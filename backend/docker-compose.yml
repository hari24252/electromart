services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      # Set NODE_ENV=production explicitly when running in production.
      # Leaving it as 'development' skips all production security hardening.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/electronics-commerce}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:5173,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      USER_JWT_SECRET: ${USER_JWT_SECRET:-development-user-secret-must-be-at-least-32-chars}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-development-admin-secret-must-be-at-least-32-chars}
      USER_REFRESH_JWT_SECRET: ${USER_REFRESH_JWT_SECRET:-development-user-refresh-secret-min-32-chars}
      ADMIN_REFRESH_JWT_SECRET: ${ADMIN_REFRESH_JWT_SECRET:-development-admin-refresh-secret-min-32-chars}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      SEED_DEMO_CATALOG: ${SEED_DEMO_CATALOG:-false}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/public/uploads/products

  frontend:
    build:
      context: ../frontend/project-bolt-sb1-sxjjgx29/project
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mongo_data:
  uploads_data:
