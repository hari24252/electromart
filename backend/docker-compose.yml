services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/electronics-commerce}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:5173,http://localhost:8080}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ElectroMart <no-reply@example.com>}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      USER_JWT_SECRET: ${USER_JWT_SECRET:-development-user-secret-must-be-at-least-32-chars}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-development-admin-secret-must-be-at-least-32-chars}
      USER_REFRESH_JWT_SECRET: ${USER_REFRESH_JWT_SECRET:-development-user-refresh-secret-min-32-chars}
      ADMIN_REFRESH_JWT_SECRET: ${ADMIN_REFRESH_JWT_SECRET:-development-admin-refresh-secret-min-32-chars}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Store Administrator}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - uploads_data:/app/public/uploads/products
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/electronics-commerce}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:5173,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      USER_JWT_SECRET: ${USER_JWT_SECRET:-development-user-secret-must-be-at-least-32-chars}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-development-admin-secret-must-be-at-least-32-chars}
      USER_REFRESH_JWT_SECRET: ${USER_REFRESH_JWT_SECRET:-development-user-refresh-secret-min-32-chars}
      ADMIN_REFRESH_JWT_SECRET: ${ADMIN_REFRESH_JWT_SECRET:-development-admin-refresh-secret-min-32-chars}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Store Administrator}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ChangeMe123!}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-ElectroMart <no-reply@example.com>}
  frontend:
    build:
      context: ../frontend/project-bolt-sb1-sxjjgx29/project
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
volumes:
  mongo_data:
  uploads_data:
